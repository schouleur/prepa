<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tristéarine en 3D</title>
<script src="https://3Dmol.org/build/3Dmol-min.js"></script>
<style>
  html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; background: #fff; color: #222; }
  #wrap { display: flex; flex-direction: column; height: 100%; }
  #bar { padding: 8px 10px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; background: #f3f4f6; border-bottom: 1px solid #ddd; }
  button { padding: 6px 10px; border: 1px solid #bbb; border-radius: 6px; background: #fff; cursor: pointer; font-size: 14px; }
  button.on { background: #1f6feb; color: #fff; border-color: #1f6feb; }
  #viewer { position: relative; flex: 1; min-height: 300px; }
  #legend { padding: 6px 10px; font-size: 13px; border-top: 1px solid #ddd; background: #fafafa; }
  .dot { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin: 0 4px 0 12px; vertical-align: middle; }
  .dot:first-child { margin-left: 0; }
  #msg { position: absolute; top: 10px; left: 10px; color: #b00020; font-size: 14px; }
</style>
</head>
<body>
<div id="wrap">
  <div id="bar">
    <strong>Tristéarine (C<sub>57</sub>H<sub>110</sub>O<sub>6</sub>)</strong>
    <button id="bGly">Glycérol en couleur</button>
    <button id="bEst">Fonctions ester</button>
    <button id="bH">Afficher les H</button>
    <button id="bStyle">Style : bâtonnets</button>
    <button id="bSpin">Rotation</button>
    <button id="bReset">Recentrer</button>
  </div>
  <div id="viewer"><div id="msg"></div></div>
  <div id="legend">
    <span class="dot" style="background:#f28e2b"></span>glycérol (3 C)
    <span class="dot" style="background:#e15759"></span>liaisons ester (C=O et O–C)
    <span class="dot" style="background:#9aa0a6"></span>chaînes d'acide stéarique (18 C)
  </div>
</div>

<script>
  // Numéros d'atomes (colonne « serial » du fichier PDB)
  var GLY_C = [21, 22, 43];
  var ESTER = [18, 19, 20, 23, 24, 25, 44, 45, 46];

  var state = { gly: false, est: false, h: false, style: 'stick', spin: false };
  var viewer = $3Dmol.createViewer('viewer', { backgroundColor: 'white' });

  function render() {
    var stick = { radius: 0.14 };
    var base = { stick: { radius: 0.14, color: '#9aa0a6' } };
    if (state.style === 'sphere') base = { sphere: { scale: 0.35, color: '#9aa0a6' } };
    if (state.style === 'ballstick') base = { stick: { radius: 0.12, color: '#9aa0a6' }, sphere: { scale: 0.2, color: '#9aa0a6' } };

    viewer.setStyle({}, base);

    if (state.est) {
      var e = { stick: { radius: 0.2, color: '#e15759' } };
      if (state.style !== 'stick') e.sphere = { scale: state.style === 'sphere' ? 0.4 : 0.28, color: '#e15759' };
      viewer.setStyle({ serial: ESTER }, e);
    }
    if (state.gly) {
      var g = { stick: { radius: 0.24, color: '#f28e2b' }, sphere: { scale: 0.42, color: '#f28e2b' } };
      viewer.setStyle({ serial: GLY_C }, g);
    }
    if (!state.h) viewer.setStyle({ elem: 'H' }, {});
    viewer.render();
  }

  function toggle(id, key) {
    var b = document.getElementById(id);
    b.addEventListener('click', function () {
      state[key] = !state[key];
      b.classList.toggle('on', state[key]);
      render();
    });
  }
  toggle('bGly', 'gly');
  toggle('bEst', 'est');
  toggle('bH', 'h');
  document.getElementById('bH').classList.remove('on');

  var order = ['stick', 'ballstick', 'sphere'];
  var names = { stick: 'bâtonnets', ballstick: 'boules et bâtonnets', sphere: 'sphères' };
  document.getElementById('bStyle').addEventListener('click', function () {
    state.style = order[(order.indexOf(state.style) + 1) % order.length];
    this.textContent = 'Style : ' + names[state.style];
    render();
  });

  document.getElementById('bSpin').addEventListener('click', function () {
    state.spin = !state.spin;
    this.classList.toggle('on', state.spin);
    viewer.spin(state.spin ? 'y' : false);
  });
  document.getElementById('bReset').addEventListener('click', function () {
    viewer.zoomTo();
    viewer.render();
  });

  fetch('tristearine.pdb')
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(function (pdb) {
      viewer.addModel(pdb, 'pdb', { keepH: true });
      render();
      viewer.zoomTo();
      viewer.render();
    })
    .catch(function () {
      document.getElementById('msg').textContent =
        "Impossible de charger tristearine.pdb : le fichier doit être dans le même dossier que cette page.";
    });

  window.addEventListener('resize', function () { viewer.resize(); });
</script>
</body>
</html>
