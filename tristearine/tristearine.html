<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tristéarine en 3D</title>
<script src="https://3Dmol.org/build/3Dmol-min.js"></script>
<style>
  html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; background: #fff; color: #222; }
  #wrap { display: flex; flex-direction: column; height: 100%; }
  #bar { padding: 8px 10px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; background: #f3f4f6; border-bottom: 1px solid #ddd; }
  button { padding: 6px 10px; border: 1px solid #bbb; border-radius: 6px; background: #fff; cursor: pointer; font-size: 14px; }
  button.on { background: #1f6feb; color: #fff; border-color: #1f6feb; }
  #viewer { position: relative; flex: 1; min-height: 300px; }
  #legend { padding: 6px 10px; font-size: 13px; border-top: 1px solid #ddd; background: #fafafa; }
  .dot { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin: 0 4px 0 12px; vertical-align: middle; border: 1px solid #999; }
  .dot:first-child { margin-left: 0; }
  #msg { position: absolute; top: 10px; left: 10px; color: #ff8a8a; font-size: 14px; z-index: 5; }
</style>
</head>
<body>
<div id="wrap">
  <div id="bar">
    <strong>Tristéarine (C<sub>57</sub>H<sub>110</sub>O<sub>6</sub>)</strong>
    <button id="bGly">Glycérol en couleur</button>
    <button id="bEst">Fonctions ester</button>
    <button id="bH" class="on">Afficher les H</button>
    <button id="bStyle">Style : bâtonnets</button>
    <button id="bSpin">Rotation</button>
    <button id="bReset">Recentrer</button>
  </div>
  <div id="viewer"><div id="msg"></div></div>
  <div id="legend">
    <span class="dot" style="background:#909090"></span>C
    <span class="dot" style="background:#ff0d0d"></span>O
    <span class="dot" style="background:#ffffff"></span>H
    <span id="lGly" style="display:none"><span class="dot" style="background:#f28e2b"></span>C du glycérol</span>
    <span id="lEst" style="display:none"><span class="dot" style="background:#4e79a7"></span>C du carbonyle (ester)</span>
  </div>
</div>

<script>
  // Numéros d'atomes (colonne « serial » du fichier PDB)
  var GLY_C = [21, 22, 43];
  var ESTER_ALL = [18, 19, 20, 23, 24, 25, 44, 45, 46];
  var ESTER_CARBONYL_C = [18, 24, 45];

  var state = { gly: false, est: false, h: true, style: 'stick', spin: false };
  var viewer = $3Dmol.createViewer('viewer', { backgroundColor: '#1c2128' });

  // Construit un style à partir d'un mode d'affichage et d'une couleur (schéma Jmol par défaut : C gris, O rouge, H blanc)
  function mk(radius, scale, color) {
    var colorSpec = color ? { color: color } : { colorscheme: 'Jmol' };
    var s = {};
    function withColor(o) { for (var k in colorSpec) o[k] = colorSpec[k]; return o; }
    if (state.style === 'sphere') {
      s.sphere = withColor({ scale: scale * 1.5 });
    } else if (state.style === 'ballstick') {
      s.stick = withColor({ radius: radius * 0.85 });
      s.sphere = withColor({ scale: scale });
    } else {
      s.stick = withColor({ radius: radius });
    }
    return s;
  }

  function render() {
    viewer.setStyle({}, mk(0.14, 0.2));

    if (state.est) {
      viewer.setStyle({ serial: ESTER_ALL }, mk(0.2, 0.3));
      viewer.setStyle({ serial: ESTER_CARBONYL_C }, mk(0.2, 0.3, '#4e79a7'));
    }
    if (state.gly) {
      var g = mk(0.24, 0.42, '#f28e2b');
      if (!g.sphere) g.sphere = { scale: 0.42, color: '#f28e2b' };
      viewer.setStyle({ serial: GLY_C }, g);
    }
    if (!state.h) viewer.setStyle({ elem: 'H' }, {});
    viewer.render();

    document.getElementById('lGly').style.display = state.gly ? 'inline' : 'none';
    document.getElementById('lEst').style.display = state.est ? 'inline' : 'none';
  }

  function toggle(id, key) {
    var b = document.getElementById(id);
    b.addEventListener('click', function () {
      state[key] = !state[key];
      b.classList.toggle('on', state[key]);
      render();
    });
  }
  toggle('bGly', 'gly');
  toggle('bEst', 'est');
  toggle('bH', 'h');

  var order = ['stick', 'ballstick', 'sphere'];
  var names = { stick: 'bâtonnets', ballstick: 'boules et bâtonnets', sphere: 'sphères' };
  document.getElementById('bStyle').addEventListener('click', function () {
    state.style = order[(order.indexOf(state.style) + 1) % order.length];
    this.textContent = 'Style : ' + names[state.style];
    render();
  });

  document.getElementById('bSpin').addEventListener('click', function () {
    state.spin = !state.spin;
    this.classList.toggle('on', state.spin);
    viewer.spin(state.spin ? 'y' : false);
  });
  document.getElementById('bReset').addEventListener('click', function () {
    viewer.zoomTo();
    viewer.render();
  });

  fetch('tristearine.pdb')
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(function (pdb) {
      viewer.addModel(pdb, 'pdb', { keepH: true });
      render();
      viewer.zoomTo();
      viewer.render();
    })
    .catch(function () {
      document.getElementById('msg').textContent =
        "Impossible de charger tristearine.pdb : le fichier doit être dans le même dossier que cette page.";
    });

  window.addEventListener('resize', function () { viewer.resize(); });
</script>
</body>
</html>
